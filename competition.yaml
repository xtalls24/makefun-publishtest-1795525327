# GTA VI trophy rarity forecast 01: forecast, for every trophy of Grand Theft Auto VI on PlayStation 5, the percent of
# the players Exophase tracks for the game who will have earned it at 2026-11-26T00:00:00Z, a week after launch, from
# everything the house recorded of the game's trophy page up to the deadline, 2026-11-21T11:30:00Z, as five quantiles a
# trophy, scored by a pinball loss on the logit scale. OPEN (the owner's thumbs up, 2026-11-19: "if it seems like it
# works let's just ship it"): status open and visibility public, in production's seed catalogue in a block of its own,
# its catalogue row in tests/unit/catalogue.test.ts OPENED_IN_TURN; 48 hours of entries from 2026-11-19T11:30Z, the
# third of the GTA 6 launch slate's three openings 30 minutes apart from 10:30Z, set by scripts/redate-bundle.ts with the
# target kept at 2026-11-26T00:00:00Z. It landed first as a sealed internal draft for the owner's review; a seed that
# inserts it open funds its $250 escrow within a minute, and its bytes never change from then (a fix is a new slug),
# the in-cluster recorder (deploy/k8s/components/gta6-trophies) listed in makefun-prod with it. Copied from
# competitions/gta6-twitch-ccu-forecast-01 (per-file cases, a pinball loss over five quantiles, final_dataset, the
# run-time tie-break, the twenty-place table) and refreshed sentence by sentence; its practice is its own, cut from the
# house's recording of launch night.
#
# The owner's ask (2026-11-18, relayed by the launch chat's root, not verbatim): GTA 6 stats bounties. The money and
# window, confirmed by the owner in the decision tray as relayed (2026-11-18): "the $250 twenty-place table, about 48
# hours of entries, scored on the earn rates at 2026-11-26T00:00:00Z"; nothing launches or locks escrow without the
# owner's final approval.
#
# Why trophy earn rates. Grand Theft Auto VI released on 19 November 2026 on PlayStation 5 and Xbox Series X|S only,
# and no console maker publishes a player count or how far players get. A trophy's earn rate is the public proxy: on
# PlayStation every story chapter, side strand, collection and stunt has a trophy, and the share of players holding
# each, a week in, says how far the launch's players got, which systems they played and where they stopped. Exophase
# tracks every player who syncs a profile and prints each trophy's rarity on one public page. Why a forecaster of it
# beats the public alternatives: there is no public forecast of a launch's trophy curve, only the rates as they stand
# (Exophase, PSNProfiles, TrueTrophies), and the winner must beat every house entry below with a calibrated spread
# over all the game's trophies at once, from two days of data, which reading today's rates does not give.
#
# The source: https://www.exophase.com/game/grand-theft-auto-vi-psn/trophies/, server-rendered HTML, each trophy one
# <li class="... award ..." data-award-id data-master data-average data-points> holding its name, description, tier
# icon and its rarity "1.10% (570.00)" (percent to 2 decimals, then Exophase's EXP), the header "<strong>638</strong>
# <span>Players Tracked</span>". Probed 2026-11-18T23:50Z: 55 trophies (1 platinum, 2 gold, 6 silver, 46 bronze, 28 of
# them hidden on PSN, every one named on the page), 638 players tracked, 943 trophies earned. Exophase sits behind
# Cloudflare: a plain node fetch or stock curl gets HTTP 403 "Just a moment...", a browser-fingerprinted curl gets the
# page by plain HTTP (collector/gta6-trophies/fetch.ts). The read tries fetch.ts PROFILES in turn, curl-impersonate
# 2.3.2's curl_chrome152, curl_firefox155 and curl_safari260, each of which got the page from s12's datacenter address
# (probed 2026-11-19T02:25Z, where curl_chrome145 and curl_chrome146 got the challenge every time); the image carries
# that release sha256-pinned (the Dockerfile's fetch stage, /opt/curl-impersonate, EXOPHASE_CURL naming the three).
#
# The recorder (collector/gta6-trophies/ parse.ts, fetch.ts, record.ts, cli.ts, dataset.ts): one read a slot, at the
# slot's start, up to 3 tries 20 s apart, one line a slot in reads.ndjson (schema makefun/gta6-trophies-read/v1: slot,
# at, ok, url, players_tracked, trophies_earned, total_trophies, every trophy {award_id, master_id, name, description,
# tier, points, rarity_pct, exp, secret}, the page's sha256), the page kept gzipped beside it (pages/<slot>.html.gz),
# never two lines for one slot, resuming and never rewriting a line. A read is ok only when the page parses whole:
# every trophy's rarity, the three header counts, and as many trophies as Total Trophies says. Two recordings:
#   - the early recording, from 2026-11-18T23:50Z every 30 minutes, run by the launch chat on the house's own machine
#     (record --cadence-minutes 30): the practice is cut from it, and the final's history takes its reads for the
#     slots before the in-cluster recorder's first (--backfill);
#   - the in-cluster recorder, every 10 minutes until 2026-11-26T01:10:00Z (record --cadence-minutes 10 --freeze-out
#     <data root>/datasets/gta6-trophy-rarity-forecast-01-final --backfill <the early recording on the claim>), which
#     freezes the final dataset itself (pitfalls.md 56): after every slot from the target on it tries the freeze, and
#     the lifecycle attaches the frozen directory (server/competitions/lifecycle/auto.ts frozenFinalStage, the
#     <slug>-final directory) and locks. Its Deployment, image (it needs the curl-impersonate binary, EXOPHASE_CURL)
#     and egress are a deploy the owner orders; it must run, and the early recording be copied onto its claim, before
#     the opening.
#
# The case (makefun/gta6-trophies-case/v1, <id>.in): schema, id, at (the checkpoint), horizon_minutes, target (at +
# horizon), levels [0.05, 0.25, 0.5, 0.75, 0.95], game {name, platform, release_date, source}, trophies (the last
# history read's, by id: {id, name, description, tier, points, secret}), history (every ok read whose slot is before
# `at`, oldest first: {slot, at, players_tracked, trophies_earned, rates}, rates in the trophies' order, null where a
# read lacked one) and notes. The forecast (/output/<id>.out, a regular file, never a link): {"trophies": [{"id": n,
# "q": [q05, q25, q50, q75, q95]}, ...]}, no other key at the top or in a row, one row for each of the case's trophies,
# each id once in any order, each q five finite numbers from 0 to 100, non-decreasing, at most 65,536 bytes. The answer
# (reference/answer.json, makefun/gta6-trophies-answer/v1: horizon_minutes and per case its at, target, the answering
# read {slot, at, players_tracked}, every trophy's rate in the case's last history read, `last`, and in the answering
# read, `actual`) and reference/manifest.json ({"cases": [{"id", "time_cap_ms": 8000}]}, the grader's per-file
# manifest). The answering read: the first ok read whose slot lies in [target, target + 60 min) and that lists every one
# of the case's trophies; with none there is no answer (no grade, no prize).
#
# The score (scorer/score.ts and scorer/forecast.ts, node22 stdlib, per-file cases; the recorder's cut imports
# scorer/forecast.ts, so the data and the grade agree on one shape): each (case, trophy, level tau) is one item,
# 2 * max(tau * d, (tau - 1) * d) with d = logit(y) - logit(q_tau), the rates in percent clamped to [0.01, 99.99]
# before the logit (the page prints 2 decimals; 0 and 100 have none). loss is the mean over every item, 6 decimals,
# lower better: the rank. The factor 2 makes a forecast whose five quantiles are equal score exactly its mean absolute
# logit error. typical_miss_pp (the mean over (case, trophy) of |y - q50| in percentage points, 2 decimals) and
# coverage_90 (the share of (case, trophy) with q05 <= y <= q95) are information; valid is the gate (1 only when every
# case's forecast is valid); run_ms (the grader's run.json wall_ms) breaks an exact tie, faster first, then the earlier
# receipt (.cosmos/rules/contest-design.mdc). An invalid case scores as if every quantile equalled the trophy's last
# rate, and makes valid 0.
#
# The house entries (prize_requires_beating_baseline: a prize needs a loss strictly below the best of them), named in
# house.yaml and entered by the automation 4 hours before the deadline. The persistence baseline (baseline/main.ts,
# the kit's starter/main.ts byte for byte, starter/main.py the same numbers): q50 the trophy's last rate,
# q_tau = inv_logit(logit(r) + z_tau * 0.5 * sqrt(d)), d the horizon in days, rounded to 4 decimals, z = (-1.645,
# -0.674, 0, 0.674, 1.645). The fitted-curve baseline (baseline-trend/main.ts): per trophy a least-squares line of
# logit rate on ln(1 + hours since 2026-11-19T00:00Z) over the last 24 hours of reads, read at the target, its spread
# the random walk's and the fit's residual combined; fewer than 3 reads fall back to persistence. Both fixed in
# advance, never tuned. The house model forecast (scripts/competitions/house-forecast.ts, kind gta6-trophies in
# grader/house-forecast.ts, replayed by grader/house-forecast-entry-gta6-trophies/main.ts): superbot at reasoning effort max
# (.cosmos/rules/house-models.mdc, 64,000 output tokens), one recorded call a phase (asked once more only if its first
# answer is not valid), answering per case and trophy a median rate m and a logit spread s, replayed with no model call
# as q_tau = inv_logit(logit(m) + z_tau * s). Dev: one call over the practice cases. Final: one call at
# 2026-11-21T09:30:00Z (the deadline - 2 h) on the case cut then (collector/gta6-trophies/cli.ts input --at), replayed
# on f00. The rules say the bar is the better baseline's if it is not entered.
#
# The house baselines' practice results: the persistence baseline loss 1.51, typical miss 0.68 points, coverage 0; the
# curve baseline the same, since every read before the refresh is flat, so its fitted line is flat with no residual and
# its forecast is persistence's byte for byte (3 significant figures at most: contest-design.mdc).
#
# The practice (dev phase; collector/gta6-trophies/cli.ts practice --dir <the early recording> --out <this directory>
# --first 2026-11-19T03:00:00Z --every 30 --count 2 --horizon 90, cut 2026-11-19T05:00Z, re-cut after Exophase's first
# refresh): per-file cases p00 and p01, checkpoints 03:00 and 03:30 UTC on 2026-11-19, each forecasting the rates 90
# minutes later (04:30 and 05:00 UTC). Every target lies after the last checkpoint, so no case file holds another's
# answer (the preflight's practice-lookup reads each case's `at` and horizon_minutes and the answer's `actual`).
# Exophase shows only the current rates, so no past read can be fetched again from it. The cadence the recorder saw:
# Exophase had not refreshed the game's counts from the first probe (2026-11-18T23:48Z) through the 04:00Z read (every
# read 638 players tracked, every rate unchanged), then refreshed them between 04:00Z and 04:30Z: 3,868 players tracked
# and 4,276 trophies earned, and every rate but the one at 100% fell (the newly tracked players held fewer), the 05:00Z read
# unchanged again. So it refreshes a game's counts on its own schedule (hours apart), not continuously. Both practice
# cases straddle that refresh: their histories (7 and 8 reads, 23:50Z to 02:30Z and to 03:00Z) are the flat launch
# night, and their answers (the 04:30Z and 05:00Z reads) the refreshed page, so the practice rewards a forecast that
# expects a refresh. The copy says so, and that the answer is what the page shows at the target, as of Exophase's last
# refresh before it. A later re-cut (the same command, a later --first, then the three digests, the copy's practice
# figures and SHIPPED_BUNDLE_SHA256 again) is the owner's call before the opening.
#
# Format: program/v1, cases: per-file beside final_dataset: true (contracts/competition.ts): each case run alone in a
# sandbox of its own, /input holding only <id>.in, its /output/<id>.out kept only when that run ended ok
# (grader/program.ts executePerCase), under its manifest's time_cap_ms (8,000). The final grades on the dataset
# gta6-trophy-rarity-forecast-01-final, frozen by the in-cluster recorder (collector/gta6-trophies/dataset.ts
# freezeFinal: input/f00.in and NOTICE.txt, reference/answer.json and manifest.json, the dataset's manifest.json last)
# and attached to the final phase by the automation (server/admin/dataset-register.ts registerAndAttachDataset,
# server/competitions/lifecycle/auto.ts frozenFinalStage). The dev phase grades on this directory's own sealed
# practice instance (input/, reference/). No race: there is one answer read, at the target.
#
# Money: the catalogue's twenty-place table, $50 / $35 / $25 / $10 x7 / $7 x10 = $250 (tests/unit/catalogue.test.ts
# TWENTY_PLACE_TABLE), each place titled as the catalogue's tables list it. Full automation (lifecycle true, payouts
# auto), the escrow funded at open (automation.escrow: at_open; server/competitions/load.ts escrowAtOpenIssues): the
# rules' Entries and Payout and the criteria's and announcement's payout lines say both outcomes in the btc-race release
# template's words (server/releases/templates/btc-race.ts; ESCROW_AT_OPEN_SAYS). No challenge window is named. The
# board copy (title, summary, demand) stays off tests/unit/support/public-copy.ts OFF_BOARD words.
#
# Entries: Force_Last, at most 10 a day and 20 in all, transcripts required, an OSI license, the repository created
# after the opening, authorship 12 (the kit's starter left out of the counted lines). Field: the recent forecast
# bounties drew 3,897 (polymarket-nvidia-ceo-forecast-01) and 3,499 (roblox-up-and-coming-forecast-01) submissions:
# sized for 4,000 and 40,000.
#
# Dates and why (proposed at the seal for 08:00Z, moved at go-live by scripts/redate-bundle.ts --opens
# 2026-11-19T11:30:00Z with the target, the answer's hour, the recorder's --until and the final's end kept; the final's
# horizon from the deadline is 6,510 minutes, 6,720 before):
#   2026-11-19T11:30:00Z   opens_at, the dev phase's start: on the half hour, 11 hours 30 minutes after the release day
#                          began
#   2026-11-21T07:30:00Z   the house baselines entered (server/competitions/house-entry-due.ts: deadline - 4 h)
#   2026-11-21T09:30:00Z   the house model forecast's final call (the deadline - 2 h), run by admin-house-forecast
#   2026-11-21T11:30:00Z   the deadline, 48 hours after the opening: the dev phase's end, f00's checkpoint and the final

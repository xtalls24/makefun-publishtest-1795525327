  - {kind: placement, place: 17, amount_usd: 7, title: 17th place}
  - {kind: placement, place: 18, amount_usd: 7, title: 18th place}
  - {kind: placement, place: 19, amount_usd: 7, title: 19th place}
  - {kind: placement, place: 20, amount_usd: 7, title: 20th place}

# limits.wall_budget_sec is not a run's limit here: each case's run is capped by reference/manifest.json's time_cap_ms
# (8,000). It states the practice's per-execution cost for the grading budget, its 2 cases x (8 s + about 10 s pod
# start) = 36 s, above the final's one case, 18 s (the header's Grading budget and load).
limits:
  cpus: 1
  memory_mb: 1024
  pids: 64
  wall_budget_sec: 36

min_authored_coverage: 0.8

prize_requires_beating_baseline: true

# A house entry that beats the gate holds the place it finishes in, unpaid, and no entry moves up (the gate's house
# entries never beat the best of them, so none holds one); the rules say so.
house_holds_places: true

automation:
  lifecycle: true
  payouts: auto
  escrow: at_open

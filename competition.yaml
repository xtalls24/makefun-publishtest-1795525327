version: 1

competition:
  slug: gta6-trophy-rarity-forecast-01
  title: Forecast how many GTA VI players earn each trophy in week one
  summary: "Write a program that reads the earn rate of every Grand Theft Auto VI trophy on Exophase as the house recorded it up to 2026-11-21 11:30 UTC and forecasts each trophy's rate at 2026-11-26 00:00 UTC, the percent of players who will have earned it by then, as five quantiles a trophy, for the lowest pinball loss on the logit scale: places go by that loss, lowest first, so 1st place is the best forecast, and a forecast must also beat our house forecasts to take any place, so one that beats them but ranks below 20th wins nothing; the lowest loss wins $50, 2nd place $35, 3rd place $25, 4th to 10th place $10 each and 11th to 20th place $7 each."
  demand: Publishers, trophy hunters and game analysts who want a calibrated read, two days after a big launch, of how far its players will have got by the end of its first week, trophy by trophy.
  category: Forecasting
  skills: [Forecasting, Time series, Statistics, Video games, TypeScript, Python]
  status: open
  visibility: public
  sponsor: make-fun
  reward_usd: 250
  opens_at: "2026-11-19T11:30:00Z"
  deadline: "2026-11-21T11:30:00Z"
  description: |-
    Grand Theft Auto VI came out on 19 November 2026. Every chapter, side story, collection and stunt in it has a trophy, and the share of players holding each one says how far the launch's players got. We want a forecaster that, two days in, says honestly how many players will hold each trophy a week after launch, and how sure it is.

    ## Context
    No console maker publishes how many people play GTA VI or how far they get. Exophase, a public trophy tracker, prints every PlayStation 5 trophy of the game with its earn rate: the percent of the players it tracks for the game who have earned it. The house reads that page on a fixed clock and keeps every read.

    Your entry is a program that reads one case and writes, for each of the game's trophies (55 at the opening), five quantiles of that trophy's earn rate at the case's target (5%, 25%, 50%, 75% and 95%). The final has one case, cut at the deadline, 2026-11-21 11:30 UTC: every read the house made before it, from launch night on. Its target is 2026-11-26 00:00 UTC. It runs offline in the sandbox, with no network, and nothing calls a model.

    Before the deadline every entry is scored on a practice cut from launch night's reads, and its score shows as it lands. After the deadline the house reads the page at the target and scores every final entry on those rates. The score is a pinball loss on the logit scale: a forecast whose five quantiles are equal scores exactly its mean miss in logit terms, so the most accurate forecast with an honest spread wins. Ties are broken by the faster program. A reward needs a lower loss than the best house entry: two house baselines, one that says every rate stays where it is and one that extends each trophy's recent curve, and a forecast by a house AI model. Once the target's read is frozen and attached, everything runs by itself, with no further admin step unless a check holds it, and each winner claims the reward in USDC on Solana: from make.fun's escrow program when the reward is locked there, otherwise from make.fun's reward wallet, as this bounty's page says.

    ## Deliverables
    - A public GitHub repository owned by your own GitHub account, created after the competition opens, under an OSI-approved license, with main.ts (Node 22) or main.py (Python 3.13) in the repository root that writes /output/<id>.out for the case /input/<id>.in it is given
    - The AI coding-agent transcripts of the sessions that built it (Claude Code, Codex, Cursor and others), uploaded with each submission

    ## Requirements
    - Standard library plus source you vendor into the repository: nothing is installed before the program runs, and it has no network
    - Read the case in /input; two runs on the same case must write the same forecast
    - At most 8 seconds, 1 CPU and 1024 MB per case
    - At most 10 submissions a day and 20 in all; your last submission before the deadline is your final entry
  rules: |-
    ## The task
    Start your agent's session at or after the competition opens (2026-11-19T11:30:00Z) and build your entry in it: a session that began before the opening cannot be entered (thinking_in_window, below). Forecast, for every trophy of Grand Theft Auto VI on PlayStation 5, its earn rate on Exophase at 2026-11-26T00:00:00Z. Your program, `node /bot/main.ts` (Node 22) or `python3 /bot/main.py` (Python 3.13) at the root of your repository, is run once per case: it reads that case's file at /input, every read the house made of the game's trophy page before the case's checkpoint, and writes one forecast file to /output: for each of the case's trophies, five quantiles of its earn rate at the case's target. It runs in a sandbox with no network, so it cannot read Exophase: it forecasts. Your score is the mean pinball loss on the logit scale over every trophy and quantile (Scoring).

    ## What is counted
    - Grand Theft Auto VI released on 19 November 2026 on PlayStation 5 and Xbox Series X|S. No console maker publishes a player count or how far players get. What this contest forecasts is each PlayStation 5 trophy's earn rate on Exophase's trophy page for the game, https://www.exophase.com/game/grand-theft-auto-vi-psn/trophies/: the percent of the players Exophase tracks for the game who have earned that trophy, as the page prints it, to 2 decimals (0.00 to 100.00). The page names every trophy, hidden ones included, and prints the players tracked.
    - The house reads that page on a fixed clock: every 30 minutes from 2026-11-18T23:50:00Z on its first recorder, and every 10 minutes on the recorder that runs through the final, each read started at its slot's first second and tried up to 3 times. A read is valid when the page parses whole: every trophy's name and earn rate, the players tracked, and as many trophies as the page's Total Trophies says. A valid read keeps every trophy's earn rate and the players-tracked count at one moment, and the page itself.
    - Exophase refreshes a game's counts on its own schedule, not with every player's trophy: the house saw the page unchanged, 638 players tracked and every rate the same, from 2026-11-18T23:48:00Z through its read at 2026-11-19T04:00:00Z, on launch night, and then refreshed by its read at 04:30:00Z: 3,868 players tracked, and every rate but the one at 100% lower than before. So a read shows the rates as of Exophase's last refresh before it, and the answer is the rates the page shows at the target, whenever Exophase last refreshed them.
    - A trophy is identified by its position in Exophase's list of the game's trophies (`id`, 1 for the platinum, Vice Got a Price!, at the opening). The trophies a case forecasts are the ones its last read lists: 55 at the opening (1 platinum, 2 gold, 6 silver and 46 bronze).

    ## The case
    - The final has one case, f00, cut at the deadline, 2026-11-21T11:30:00Z: every valid read the house made before it, from its first recorder's reads on launch night to the last read before the deadline, oldest first. Its target is 2026-11-26T00:00:00Z, 6,510 minutes after the deadline. The house records the reads while they happen, so no one, the house included, has the answer before the target has passed.
    - The practice is the same shape over two cases cut from the house's recording of launch night, 2026-11-19 (UTC), cases p00 and p01: checkpoints 03:00 and 03:30 UTC, each forecasting the rates 90 minutes later, at 04:30 and 05:00 UTC. Every target is after the last checkpoint, so no case holds another case's answer. Both cases straddle Exophase's first refresh of the game's counts: every read in their histories is the unchanged page of launch night, and their answers are the refreshed page, so the practice checks that your program reads a case and writes a valid forecast, and how its spread copes with a refresh it has not seen; one refresh over 90 minutes is little guide to the final's week.

    ## Your input
    - /input/<id>.in, the one case your run is given (f00, or a practice case such as p00): UTF-8 JSON, one object (schema "makefun/gta6-trophies-case/v1"):
    - `id`; `at` (the checkpoint, ISO 8601 UTC); `horizon_minutes` and `target` (`at` plus the horizon: the instant whose rates you forecast); `levels` ([0.05,0.25,0.5,0.75,0.95]); `game` ({`name`, `platform`, `release_date`, `source`, the page's address});
    - `trophies`: the case's trophies in id order, each {`id`, `name`, `description`, `tier` (platinum, gold, silver or bronze), `points` (PSN points: 300, 90, 30 or 15), `secret` (hidden on PSN)};
    - `history`: every valid read before `at`, oldest first, each {`slot` (the read's clock slot), `at` (when it was read), `players_tracked`, `trophies_earned` (the page's count of trophies earned by tracked players), `rates`}: `rates` is one earn rate per trophy, in the order of `trophies`, null where that read lacked the trophy; and `notes`, where the data comes from.
    - /input/NOTICE.txt is beside the cases in the kit's input/: where the rates come from. Your program is run with only its case's file there, so read every `*.in` file you find, in name order, and write one output for each.
    - Your program reads $MAKEFUN_INPUT_DIR when that is set, else /input/, and writes to $MAKEFUN_OUTPUT_DIR when that is set, else /output/: the grader's container leaves both unset, and a run on your machine sets both (Entries, below).

    ## Your forecast
    - /output/<id>.out for the case /input/<id>.in, a regular file (not a link) of at most 65,536 bytes of UTF-8 JSON: one object with exactly one key, `trophies`, a list with exactly one row for each of the case's trophies, each id once, in any order, each exactly `{"id": n, "q": [q05, q25, q50, q75, q95]}` with no other key: five quantiles of trophy n's earn rate at the target, in percent, at the levels 0.05, 0.25, 0.5, 0.75 and 0.95 in that order, each a finite number from 0 to 100 (fractions are fine), each at least the one before it (equal is fine).
    - For example `{"id":4,"q":[0.1931,0.5403,1.1,2.2264,6.0088]}` is the house baseline's row in the final for a trophy whose last rate is 1.10%, and `{"id":4,"q":[0.8974,1.012,1.1,1.1955,1.3477]}` its row in a practice case, whose horizon is 90 minutes.
    - A case whose output is missing, too large, not JSON or not of this shape, or whose run crashed or ran over its 8 seconds, is an invalid case: it is scored as if every quantile of every trophy were that trophy's rate in the case's last read, and an entry with any invalid case ranks below every entry whose cases are all valid and takes no prize.

    ## Scoring
    - Every case, each of its trophies and each of the five levels tau is one item. Its pinball loss is 2 x max(tau x d, (tau - 1) x d), where d = logit(y) - logit(q), y is the trophy's earn rate in the answering read, q your quantile at tau for it, and logit(x) = ln(p / (1 - p)) with p = x / 100 after x is clamped to 0.01 to 99.99 (the page prints 2 decimals, and 0% and 100% have no logit): a quantile below the rate costs 2 x tau per unit of logit it is short, one above it 2 x (1 - tau) per unit it is over, so the 5% quantile should sit where the rate is below it one time in twenty. The logit scale makes a miss from 1% to 2% cost about what a miss from 33% to 50% does, so rare trophies count as much as common ones.
    - Loss (the rank): the mean pinball loss over every item of every case, written to 6 decimals; lower is better and 0 is the best. A forecast whose five quantiles are equal scores exactly its mean absolute logit error, the mean of |logit(y) - logit(q)|, so the most accurate forecast and an honest spread are scored on one scale. The board ranks on those 6 decimals; its public rows round it to 3 significant figures, and your own entries' rows, the result document and the archive keep it exact. Every rank, tie and prize is decided on the exact value.
    - The board also shows the typical miss (the mean over every scored trophy of |y - your median|, in percentage points), the 90% coverage (the share of scored trophies with your 5% quantile at or below the rate and your 95% quantile at or above it; an honest forecast covers about 0.9) and valid (1 when every case is valid, else 0). They are information: only the loss ranks.
    - A worked example: say a case scores two trophies and the forecast's rows for them are both [10, 15, 20, 25, 35]. The first trophy's rate is 22%: the five items cost 0.093156, 0.234467, 0.120628, 0.083527 and 0.064663. The second's is 8%: 0.465733, 1.061619, 1.056053, 0.671867 and 0.182331. The loss is the mean of the ten, 0.403404; the typical miss 7 points; the 90% coverage 0.5 (the first rate inside the 5% to 95% band, the second below it). Had that case been invalid with last rates of 30% and 5%, every quantile would be its trophy's last rate and the loss the mean absolute logit error, (0.418369 + 0.502092) / 2 = 0.46023.
    - Exactly equal losses are ordered by the run time, faster first: the grader's own measurement of the wall time your program takes over all of a phase's cases, averaged over its two executions, in whole milliseconds (run_ms), on the same 1-CPU sandbox every entry runs in; exactly equal run times go to the earlier receipt. It only breaks an exact tie and is never part of the loss.
    - The pinball loss is a proper scoring rule for quantiles: you score best on average by writing the quantiles you really believe. A forecast that is too narrow pays for every trophy outside it, one too wide pays at every trophy, and one whose median sits where the rate is not pays at both.

    ## The answer and the recording
    - The answer is the first valid read the house makes in the hour from 2026-11-26T00:00:00Z (a read whose slot is at or after 00:00 UTC and before 01:00 UTC) that lists every one of f00's trophies: each trophy's earn rate in it. The recorder that runs through the final reads every 10 minutes until 2026-11-26T01:10:00Z. With no such read in that hour there is no answer, the final is not graded and no prize is paid (Payout).
    - Once the answering read is in, the house freezes the recording into the final dataset, which is attached to the final phase and published with the results: the case every entry read and every rate it is scored on, so anyone can score every final entry again on the same rates.
    - Before the deadline the practice cases are scored the same way, each against the first valid read of the house's launch-night recording in the hour from its target. Exophase shows only the current rates, so a past read cannot be fetched again from Exophase itself. The practice pays nothing.

    ## Baseline and prizes
    - The house baseline (starter/main.ts in the kit) says every trophy's rate stays where the last read put it, with a spread that widens on the logit scale like a random walk's: for each trophy, q_tau = 100 / (1 + exp(-(logit(r) + z_tau x 0.5 x sqrt(d)))), rounded to 4 decimals, where r is the trophy's rate in the case's last read, d the case's horizon in days and z_tau the standard normal's quantile at each level (-1.645, -0.674, 0, 0.674, 1.645). In the final, for a trophy last at 1.10%, its row runs from 0.1931 to 6.0088 around 1.1. Its numbers were fixed in advance, never tuned on the practice. On the practice it scores a loss of about 1.51 (typical miss about 0.68 points, 90% coverage about 0, every case valid): the refresh took every rate it scores outside its narrow 90-minute band. The kit's starter, the same program, scores the same. It is graded on the final like every entry.
    - The house curve baseline (baseline-trend/main.ts, not in the kit) fits, for each trophy, a straight line to its logit rate against ln(1 + the hours from 2026-11-19T00:00:00Z to the read) over the case's last 24 hours of reads, by least squares, and reads the line at the target, its spread the random walk's above and the fit's residual combined; with fewer than 3 reads it says what the house baseline says. Its numbers were fixed in advance too. On the practice it scores a loss of about 1.51: every read before the refresh is the same, so its line is flat and its forecast the house baseline's.
    - The house model forecast: the house also enters the forecast of an AI model (superbot, at reasoning effort max, with a 64,000-token output budget), made by one recorded call the house pays for (asked once more, the same prompt, only if its first answer is not a valid forecast), given these rules, the forecast's format and the case's data. It answers, for each case and each trophy, a median rate m and a logit spread s. Its answer is recorded, and every grading replays it with no new call: q_tau = 100 / (1 + exp(-(logit(m) + z_tau x s))). It is made once for the practice, over the practice cases, and once for the final, at 2026-11-21T09:30:00Z, two hours before the deadline, on every read recorded to then, and replayed on f00.
    - Twenty places pay $250 in USDC: $50 for 1st place, $35 for 2nd, $25 for 3rd, $10 each for 4th to 10th and $7 each for 11th to 20th, one place per entrant. Places go by loss, lowest first, so 1st place is the best forecast that beats the best house entry. Beating the best house entry makes a forecast eligible, not a winner: when more than twenty forecasts beat it, only the twenty with the lowest losses take places. A prize needs a loss strictly below the best house entry's on the final: the lowest of the house baseline's, the house curve baseline's and the house model forecast's (the two baselines' alone if the house model forecast was not entered), and every case valid. An entry at or above it keeps its rank but takes no place, and the next entry below it takes the place. The house entries rank on the leaderboard and take no place, since the bar is the lowest of their losses and none is below it; any other entry make.fun enters itself ranks like any other entry and must beat them too. A house bot that finishes in a paid place holds that place, and that place's prize is not awarded; no entry moves up to take it. A place no entry is left to take is not awarded. Exactly equal losses go to the faster program, then the earlier receipt.

    ## Transcripts
    Every submission must include the transcripts of the AI coding-agent sessions that built it (the session logs Claude Code, Codex, Cursor or another agent harness writes while it runs), as a makefun bundle or as loose files, up to 200 MB. A session file exported afterwards (a SpecStory export, or a chat log your agent writes out) must carry the model provider's usage on its assistant messages and name the harness that wrote it; one your agent hands over because its tool keeps no session record (a session file it exported itself carrying "handed_over") need not carry usage, and its entry is ranked but takes no paid place; a ChatGPT or Claude account export carries no usage and is not accepted. Secrets are redacted on the server. The transcripts are matched against the code for authorship and priced for build cost. Code written by hand is allowed; it lowers authored coverage.

    ## Transcript gate
    Before an entry is graded, its transcripts pass a gate of ten pass/fail checks. The gate is never a score, and it has no AI judge and no AI-text detection: no check reads what a thinking block says, so a session whose thinking the provider summarised or left out passes on what the agent did. An entry that fails any check is rejected: it is not graded and takes no prize, and its status names each failed check with its fix, so you can fix it and submit again before the deadline.
    - transcripts_present: at least one session is parsed from the upload.
    - transcripts_recorded: every session is a log a harness recorded or a file exported from its record; a session your agent hands over because its tool keeps no session record (a session file it exported itself carrying "handed_over", one line saying why) makes this check skip as a note naming it, never a rejection, and the entry's build cost is labelled Handed over; under handed_over_places none: An entry with a handed-over session is ranked where it scores but takes no paid place: to compete for rewards, tell the person you work for to run you in a client whose sessions are recorded. If you cannot hand over what you can see, use Superbot (https://superbot.gg), a free client: run on your own computer, it keeps sessions that bundle reads.
    - thinking_wellformed: every user, assistant and tool message of a session carries a timestamp (a handed-over session's messages may carry none, and the times they carry are held to the rest), no assistant or tool message falls more than 60 s behind the latest before it, and every tool result answers one earlier tool call of its session; a session file your agent exported itself names the harness that wrote it, in the file or with bundle's --harness.
    - thinking_in_window: every transcript timestamp lies between the competition's opening and the entry's receipt time, give or take 60 s of clock skew.
    - thinking_reproduces: at least 30% of the counted lines are authored, first carried by a write or edit of the agent's own in the transcripts; a line that first appears in a human's message (pasted), in a tool result or a file read back (read) or nowhere in them (absent), and a line the agent re-typed, renamed or reformatted from code a tool result or a message showed it first (copied: code cloned, downloaded, copied or pasted in), count against the share, and the lines of the kit's starter, as handed out or re-typed from it, are left out of the counted lines; at most 40% of the counted lines of text files are unwritten: absent, or read in a file an import command the agent ran brought in (git clone, curl or wget to a file, cp from outside the repository, an archive unpacked, a project generator), which fails only once 10 or more lines are; and the entrypoint (main.ts or main.py) has at least one authored line; a packed entrypoint the kit's makefun compress wrote counts as the source it was packed from, which bundle uploads beside the sessions, when makefun compress makes the entrypoint from that source byte for byte and the sessions show the agent writing the source and then running makefun compress on it later than the latest message in which one of the source's authored lines first appears (an edit that only deletes or re-types lines is no write), shown by the agent's own command running makefun compress on the source or by the line makefun compress prints, in a tool result or any other message; the source's lines then count toward the share as any counted file's do, a line repeated in it counted once.
    - thinking_turns: at least 5 assistant turns carry text or thinking (a turn that only calls tools does not count).
    - thinking_priced: an unpriced usage record is a warning, never a rejection (the entry's build cost then reads unknown), though every usage record should price to a known model, or to $0 where the record's session ran its model on your own machine (a local runtime or loopback server the session records, never a model's name or a self-export's stated provider), for this check alone, never the entry's build cost; a self-reported session (a file exported afterwards, not a log a known harness wrote; a file in Claude Code's or Muse Code's session format without the token usage those harnesses record on every response, or in Claude Code's without its version, is one) carries the provider's usage on at least 50% of its assistant messages, with the provider's own token counts, not rounded, estimated or repeated figures (a provider's input count grows as the conversation does, so one pair of counts does not keep coming back), and its output is no more than a model produces in the time its own timestamps span (500 tokens a second); a handed-over session need not carry usage, but the usage it does carry is held to the same rules; an upload of harness-recorded logs with no usage has nothing to price; an entry whose sessions are the Muse app's own session files carries its agent's token usage as Muse recorded it (at least one usage row across them), attached with bundle's --muse-usage.
    - thinking_revised: some file (the entrypoint, or the code it runs) takes its final content from at least 2 assistant messages that write or edit it (a file written once in full and never revised counts 1).
    - thinking_fresh: for an entry uploaded as a source bundle, every credited line comes from agent sessions that show the anchor line the kit's init prints (makefun anchor <root sha> round <round>) in a tool result before their first counted write (a Claude subagent launched after its parent's quote, or a Codex fork of a session that quoted it, counts with it); short of that the check skips as a note: the entry is not rejected, and its reward, if it places, is paid as any other. A quote timestamped before the round fails.
    - transcripts_run_record: an entry received from 17 November 2026 (00:00 UTC) carries a run record (bundle writes it into the bundle; a loose upload adds makefun-run.json) and is rejected without one, or with one its upload contradicts: its prompt is the person's own opening prompt, never blank, a template left unfilled or an agent's or a harness's hand-off, and one marked typed is the first message of an uploaded top-level session, while any other names what started the run; the harness, its version, the provider, the model and the effort are each declared or recorded by every top-level session (a model id that names its provider, such as claude-*, gives the provider; --effort default names the harness's own effort, and --effort none a real level); a system prompt marked uploaded comes as a system-prompt file, and one marked in-session is carried by a session; every MCP server a session used (an mcp__<server>__<tool> tool it called, or a server its log lists) is listed by its name, and none is marked builtin unless a harness the sessions ran under ships it (Claude Code's ide, claude-in-chrome, workspace, computer-use, Claude Preview and Claude Browser, Claude Desktop's ccd_turn, Cosmos's cosmos and Codex's codex_apps); and the instruction files it states are collected only where the upload carries one and none only where it carries none. An entry received from 18 November 2026 (12:00 UTC) is rejected, too, when its record withholds the system prompt or the instruction files (a system-prompt file that only says why it is withheld holds no system prompt), or when another session started its run (its prompt marked handed-off, or no top-level session opening with the prompt while one opens with a hand-off, a brief or a resumed conversation's summary) and the upload does not carry its parent chats, every link up to the session that opens with the prompt; before then each is a note. From 20 November 2026 (00:00 UTC), too, an entry is rejected when it declares a harness or a model its top-level sessions contradict; a system-prompt or instruction file counts as none when it holds nothing but redaction marks, is not text or is over the size cap, a system prompt also when it is almost all redaction or only a stub line such as none or withheld, and an instruction file when it is the system prompt again in a record a kit from level 22 wrote; and a parent chat counts as none when it repeats a link or is one of the build's own sessions, unless that session asked for the one it parents. An entry received before 17 November 2026 (00:00 UTC) with no run record skips as a note, and a run record it does carry is checked the same way.

    ## Entries
    - Node 22 (node /bot/main.ts) or Python 3.13 (python3 /bot/main.py): one of the two at the repository's root, not both. Source and the standard library only, nothing installed, no network.
    - Your program is run once per case, each run in a sandbox of its own with only that case's file in /input: at most 8 seconds, 1 CPU, 1024 MB and 64 processes per run. /bot, your repository, is read-only; /output is where your forecast goes. Each phase's cases are run twice and the two forecasts of each case must be the same byte for byte, so seed any randomness. An entry whose two executions of any case differ is scored from the first and is not ranked.
    - A practice grade runs your program twice on each practice case, each run starting a sandbox of its own: about 2 seconds a start when few entries are being graded, 8 to 11 seconds at full load (up to 20 at the 90th percentile), so on production a practice grade takes about 10 seconds a run when quiet and 15 to 20 seconds a run at full load, plus about 10 seconds.
    - The kit's starter/ is the house baseline laid out as an entry, with an MIT LICENSE: run it locally on the practice with `mkdir -p out && MAKEFUN_INPUT_DIR=input MAKEFUN_OUTPUT_DIR=out node starter/main.ts` from the kit's directory (starter/main.py is the same program in Python).
    - Entries are taken from the opening at 2026-11-19T11:30:00Z to the deadline at 2026-11-21T11:30:00Z. At most 10 submissions a day and 20 in all; your last submission before the deadline is your final entry. Every entry needs the transcripts of the agent sessions that built it.
    - The entry signature: a wallet linked to your account signs the entry message (make.fun entry v1), which names this site, the competition, the repository, the commit, the sha256 of the transcripts uploaded with it, the wallet, a fresh nonce and the time it was issued. A signed message is good for 10 minutes and enters one submission only. When the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to your account, and a prize the entry wins is claimed from the escrow to that wallet (see Payout). Otherwise the reward is paid from make.fun's reward wallet and an entry needs no signature: a prize is claimed with the payout details alone, and an entry may still carry the signature. This bounty's page says which.
    - The repository and commit of an entry are shown only to its entrant and the organisers, before the deadline and after it.
    - Your repository is public on GitHub from the moment you create it, so anyone can read your code and see which GitHub account owns it, even though this site shows it only to you and the organisers.

    ## Payout
    The final leaderboard is published within 7 days of the deadline, unless a check holds it: the results come once the target's rates have been recorded and graded. Once the final dataset the house froze from its recording is attached, every final entry is graded on it, the runs that would be paid are graded again and the entries are scanned for copies, and the results are published and resolved with no further admin step. The prizes are paid in USDC on Solana only (no bank wire), in one of two ways, and this bounty's page says which. When the bounty opens, its whole reward is locked in make.fun's escrow program on Solana if the escrow can be funded. When the reward is locked in the escrow, every entry is signed by a Solana wallet linked to the entrant's account (see Entries), and once the result is posted each winner claims the prize from the escrow to the wallet that signed the winning entry, the claim screened against the sanctions list; a prize that nobody wins or claims goes back to make.fun's reward wallet after the escrow's claim window.

    Otherwise the reward is paid from make.fun's reward wallet as follows, and an entry needs no signature. Once the results are resolved, each winner claims the prize within 7 days with the payout details: a Solana address to pay it to and the winner agreement. A legal name, the country of residence and a tax form (a W-9 for a US person, a W-8BEN for anyone else) are asked only when the winner's prizes from make.fun in the calendar year, this prize included, reach the $2,000 tax reporting threshold; below it, the claim asks for none of them. The claim is screened against the sanctions list, then the house pays it from make.fun's reward wallet in USDC on Solana: at once when the address is a wallet linked to the winner's account by signature and the automatic checks clear it, otherwise once the organisers have screened it. A prize not claimed within 7 days passes to the next entry in the standings. A prize that no entry takes or claims (a place no prize-eligible entry is left to take, or one passed down the standings until no eligible entry is left) is never paid out: its money stays in make.fun's reward wallet for later contests.

    If there is no answer (The answer and the recording), no result is posted and no prize is paid, whichever way the reward was to be paid: a reward locked in the escrow goes back to make.fun's reward wallet once the escrow's resolve window, 14 days after the final phase ends, has passed with no result posted.

    Every prize is paid gross, subject to statutory withholding; any tax due on it is the winner's own.

    Open to individuals 18 or older (or the age of majority where they live), except residents of comprehensively sanctioned countries, anyone on a sanctions list, and where prohibited by law.
  resolution:
    method: automated
    summary: "Every final entry forecasts, from Grand Theft Auto VI's trophy earn rates on Exophase as the house recorded them up to the deadline, 2026-11-21 11:30 UTC, each trophy's rate at 2026-11-26 00:00 UTC as five quantiles, and ranks by its mean pinball loss on the logit scale over every trophy and quantile, lowest first: 1st place goes to the best forecast. Beating the best house entry only qualifies a forecast; the 20 lowest-loss forecasts that beat it take the 20 places, one per entrant, an entry that beats the house but ranks below 20th wins nothing, and a paid place a house bot holds is not awarded. The lowest loss wins a $50 reward, twenty places paying $250 in all."
    criteria:
      - "Harness: program/v1, run once per case; the entry runs offline on each case's /input/<id>.in alone and writes /output/<id>.out, each case twice with the outputs compared, at most 8 seconds a run, and the sealed scorer scores every case against the recorded rates"
      - "Rate: each PlayStation 5 trophy's earn rate on Exophase's Grand Theft Auto VI trophy page, the percent of tracked players who have earned it, to 2 decimals, read by the house recorder every 10 minutes (every 30 on launch night)"
      - "Case: one final case, f00, at the deadline 2026-11-21T11:30:00Z, holding every valid read before it; it forecasts every trophy's rate at 2026-11-26T00:00:00Z, answered by the first valid read listing every trophy in the hour from then; with none there is no answer and no prize"
      - "Rank: the mean over every trophy and level 0.05, 0.25, 0.5, 0.75 and 0.95 of 2 x max(tau x d, (tau - 1) x d), d = logit y - logit q of the rates clamped to 0.01 to 99.99, to 6 decimals, lowest first, so equal quantiles score their mean absolute logit error; an invalid case is scored as every quantile at the trophy's last rate and takes the entry out of the prizes; ties by the faster run time (run_ms), then the earlier receipt"
      - "Prizes: $50 for 1st place, $35 for 2nd, $25 for 3rd, $10 each for 4th to 10th and $7 each for 11th to 20th, one place per entrant, paid by the house in USDC on Solana; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Beat the house: a prize needs a loss strictly below the best house entry's on the final, the house persistence baseline's, the house curve baseline's or the house model forecast's; an entry that does not beat it keeps its rank and takes no place, and a place no entry is left to take is not awarded"
      - "Payout: in USDC on Solana only, and the bounty's page says which way: when the reward is locked in make.fun's escrow program on Solana, every entry is signed by a Solana wallet linked to the entrant's account and each winner claims the prize from the escrow to that wallet once the result is posted, a prize nobody wins or claims going back to make.fun's reward wallet after the claim window; otherwise an entry needs no signature, each winner claims within 7 days (a legal name, country and tax form only once the winner's prizes from make.fun reach $2,000 in the calendar year), the claim is screened against the sanctions list and paid from make.fun's reward wallet, at once to a wallet linked by signature when the automatic checks clear it, an unclaimed prize passes to the next entry in the standings, and a prize nobody takes or claims stays in make.fun's reward wallet for later contests"
      - "Reproducible: the final dataset (the case every entry read and every rate it is scored on) is published with the results, so anyone can run and score every final entry again on the same rates"
    source: Exophase's Grand Theft Auto VI PS5 trophy page (https://www.exophase.com/game/grand-theft-auto-vi-psn/trophies/), every trophy's earn rate read by the house recorder, the answer read at 2026-11-26T00:00:00Z
    verifier: make.fun grader runs every final entry twice on the case of the frozen final dataset and scores it with the sealed scorer; the results are published and resolved automatically once the final grades, the regrades of the would-be winners and the scan for copies are done
    tie_break: Equal losses go to the faster program (the lower run time, run_ms), then to the earlier receipt
    announce: Final leaderboard within 7 days of the deadline unless a check holds it, once the target's rates are recorded and graded; in USDC on Solana, winners claim from make.fun's escrow program once the result is posted when the reward is locked there, otherwise within 7 days from make.fun's reward wallet
    metric:
      name: Pinball loss on the logit scale
      unit: logits
      better: lower


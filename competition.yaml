# the final 0.74 hours expected and 1.30 worst, the practice 0.06 of its lane-days a day; pods 48 at once on s9 and 64
# pod-seconds an entry at 2,000 and at 20,000 entries alike (the 48 grading lanes bound it), beside the 48 pods of the
